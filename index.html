<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>禪沙庭園</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:Georgia,"Noto Serif TC","Noto Serif JP","Noto Serif KR",serif;color:#45290e;background:#c9a563}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    #intro,#game{position:fixed;inset:0}
    #intro{display:flex;flex-direction:column;background:radial-gradient(circle at 50% 16%,#f2dba1 0,transparent 55%),repeating-radial-gradient(circle at 30% 40%,#ffffff12 0 1px,transparent 1px 8px),linear-gradient(155deg,#e0bd79,#b98946)}
    .intro-head{height:56px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
    #greeting{font-size:clamp(14px,2vw,19px);font-weight:bold}
    .gear{border:0;background:transparent;color:#4e2b0c;font-size:27px;width:44px;height:44px;line-height:1;flex:none}
    .intro-main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:12px 16px 25px}
    h1{font-size:clamp(32px,7vw,76px);letter-spacing:.14em;text-align:center;line-height:1.2;margin:0}
    .subtitle{text-align:center;font-size:clamp(14px,2vw,19px);margin:7px 0 20px}
    .intro-grid{width:min(100%,920px);display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .card{min-height:105px;padding:12px;border:1px solid #9a713d77;border-radius:15px;background:#fff2c65c;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
    .card .emoji{font-size:27px}
    .card strong{font-size:17px}
    .card small{font-size:13px;line-height:1.5}
    .card.wide{grid-column:span 3;background:#d7efcf70}
    .start{margin-top:19px;padding:12px 38px;border-radius:30px;border:1px solid #ebcd86;color:#ffe8b0;background:#684014;font-size:17px}
    #music-tip{margin:12px 0 0;font-size:13px;color:#5d3a12;text-align:center}
    #game{display:none;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    .bar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 9px;background:linear-gradient(90deg,#d8b879,#c39b5b);border-bottom:1px solid #986e3a}
    .bar-title{white-space:nowrap;font-weight:bold;font-size:15px}
    .tools{flex:1;min-width:0;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
    .tool{border:1px solid #a37840;border-radius:8px;background:#fff2c657;color:#4b2a0c;padding:7px 9px;white-space:nowrap;font-size:13px}
    .tool.active{background:#f6e5ba;border-color:#603b12;box-shadow:inset 0 0 0 1px #b8894a}
    #sand-wrap{position:relative;flex:1;min-height:0;overflow:hidden}
    canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;-webkit-touch-callout:none}
    #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);pointer-events:none;color:#fffaf0;background:#79603cb8;border-radius:20px;padding:6px 13px;font-size:13px;text-align:center;opacity:0;transition:opacity .2s;max-width:90%}
    #hint.show{opacity:1}
    #settings{position:fixed;right:10px;top:58px;z-index:1000;width:min(300px,calc(100vw - 20px));max-height:calc(100dvh - 76px);overflow-y:auto;background:linear-gradient(155deg,#e9ce93,#c8a163);border:1px solid #94662d;border-radius:16px;box-shadow:0 12px 35px #35200b66;padding:14px}
    #settings h2{font-size:17px;margin:1px 0 13px}
    .setting-label{font-size:13px;margin:12px 0 5px;font-weight:bold}
    .sound-row{display:flex;gap:9px;align-items:center}
    .sound-row input{flex:1;min-width:0;accent-color:#6c471e}
    .sound-row button,.menu-btn,.modal-btn{border:1px solid #9d7137;border-radius:8px;background:#fff0c477;color:#45290e;padding:7px 10px}
    .lang-select{width:100%;padding:8px;border:1px solid #9d7137;border-radius:8px;background:#fff0c4aa;color:#45290e;font-size:16px}
    .menu-btn{width:100%;text-align:left;margin-top:6px;font-size:14px}
    a.menu-btn{display:block;text-decoration:none}
    .settings-divider{border:0;border-top:1px solid #98704070;margin:13px 0}
    .modal{position:fixed;inset:0;z-index:2000;background:#211303a8;display:flex;justify-content:center;align-items:center;padding:16px}
    .modal-box{width:min(420px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;border-radius:17px;border:1px solid #a8793b;background:linear-gradient(150deg,#efdaa2,#d1aa6e);box-shadow:0 15px 45px #1b120966;padding:22px}
    .modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .modal-top h2{font-size:22px;margin:0}
    .close{border:0;background:transparent;font-size:23px;color:#45290e}
    .modal-box p{line-height:1.8;margin:12px 0;font-size:15px}
    .modal-box label{display:block;margin:12px 0 7px}
    .modal-box input[type=text]{width:100%;border-radius:8px;border:1px solid #a27b4a;padding:10px;background:#fff7e2;font-size:16px;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
    .modal-btn{display:inline-block;margin-top:12px;text-decoration:none}
    .support-link{display:block;width:100%;margin-top:16px;padding:12px 14px;text-align:center;font-size:16px;font-weight:bold;background:#684014;color:#ffe8b0;border-color:#4a2b0c}
    .feedback-actions{display:flex;gap:14px;margin-top:16px;justify-content:center}
    .feedback-actions .modal-btn{width:68px;height:68px;margin-top:0;padding:0;border-radius:50%;text-align:center;font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center}
    .feedback-actions .modal-btn.selected{background:#f6e5ba;border-color:#603b12;box-shadow:inset 0 0 0 2px #b8894a}
    #feedback-msg{min-height:27px;color:#3f6a2b;text-align:center}
    .note{font-size:12px!important;color:#654622}
    #profile-msg{font-size:13px;min-height:19px;margin-top:8px;color:#3f6a2b}
    #profile-msg.error{color:#9b2f20}
    @media(max-width:600px){
      .intro-grid{grid-template-columns:repeat(2,1fr)}
      .card.wide{grid-column:span 2}
      .card{min-height:94px;padding:9px}
      .card strong{font-size:15px}
      .card small{font-size:12px}
      .card .emoji{font-size:22px}
    }
    @media(max-width:650px){
      .bar{align-items:flex-start}
      .bar-title{display:none}
      .tools{justify-content:center}
      .tool{font-size:12px;padding:7px 6px}
    }
  </style>
</head>
<body>
  <section id="intro">
    <header class="intro-head">
      <span id="greeting" aria-live="polite"></span>
      <button class="gear" type="button" data-settings data-i18n-aria="openSet" aria-expanded="false">⚙️</button>
    </header>
    <main class="intro-main">
      <h1 data-i18n="title"></h1>
      <p class="subtitle" data-i18n="sub"></p>
      <div class="intro-grid">
        <div class="card"><span class="emoji">🖊</span><strong data-i18n="rakeT"></strong><small data-i18n="rakeD"></small></div>
        <div class="card"><span class="emoji">👆</span><strong data-i18n="fingT"></strong><small data-i18n="fingD"></small></div>
        <div class="card"><span class="emoji">〇</span><strong data-i18n="ripT"></strong><small data-i18n="ripD"></small></div>
        <div class="card"><span class="emoji">⬤</span><strong data-i18n="stoT"></strong><small data-i18n="stoD"></small></div>
        <div class="card"><span class="emoji">✨</span><strong data-i18n="allT"></strong><small data-i18n="allD"></small></div>
        <div class="card wide"><span class="emoji">🤚</span><strong data-i18n="smT"></strong><small data-i18n="smD"></small></div>
      </div>
      <button class="start" id="start" type="button" data-i18n="start"></button>
      <p id="music-tip" class="hidden" data-i18n="tip"></p>
    </main>
  </section>

  <section id="game" data-i18n-aria="aGame">
    <header class="bar">
      <span class="bar-title" data-i18n="title"></span>
      <div class="tools" role="toolbar" data-i18n-aria="aTools">
        <button class="tool active" data-tool="rake" type="button" data-i18n="tRake"></button>
        <button class="tool" data-tool="finger" type="button" data-i18n="tFing"></button>
        <button class="tool" data-tool="ripple" type="button" data-i18n="tRip"></button>
        <button class="tool" data-tool="stone" type="button" data-i18n="tSto"></button>
        <button class="tool" data-tool="smooth" type="button" data-i18n="tSm"></button>
        <button class="tool" id="smooth-all" type="button" data-i18n="tAll"></button>
        <button class="tool" id="reset" type="button" data-i18n="tReset"></button>
      </div>
      <button class="gear" type="button" id="home-button">🏠</button>
      <button class="gear" type="button" data-settings data-i18n-aria="openSet" aria-expanded="false">⚙️</button>
    </header>
    <div id="sand-wrap">
      <canvas id="sand" data-i18n-aria="aSand"></canvas>
      <div id="hint" role="status"></div>
    </div>
  </section>

  <aside id="settings" class="hidden">
    <h2 data-i18n="setT"></h2>
    <div class="setting-label">🌐 語言 / Language</div>
    <select id="lang-select" class="lang-select" aria-label="Language">
      <option value="zh">繁體中文</option>
      <option value="zh-CN">简体中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="de">Deutsch</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="ms">Bahasa Melayu</option>
    </select>
    <div class="setting-label" data-i18n="lMusic"></div>
    <div class="sound-row">
      <input id="music-volume" type="range" min="0" max="100" value="18" data-i18n-aria="vMusic">
      <button id="music-toggle" type="button"></button>
    </div>
    <div class="setting-label" data-i18n="lFx"></div>
    <div class="sound-row">
      <input id="fx-volume" type="range" min="0" max="100" value="55" data-i18n-aria="vFx">
      <button id="fx-toggle" type="button"></button>
    </div>
    <hr class="settings-divider">
    <button class="menu-btn" id="profile-button" type="button" data-i18n="bProf"></button>
    <button class="menu-btn" id="about-button" type="button" data-i18n="bAbout"></button>
    <button class="menu-btn" id="feedback-button" type="button" data-i18n="bFb"></button>
    <a class="menu-btn hidden" id="suggest-link" href="#" target="_blank" rel="noopener noreferrer" data-i18n="bSug"></a>
    <button class="menu-btn" id="support-button" type="button" data-i18n="bSup"></button>
  </aside>

  <div class="modal hidden" id="about-modal" role="dialog" aria-modal="true" aria-labelledby="about-title">
    <div class="modal-box">
      <div class="modal-top"><h2 id="about-title" data-i18n="aT"></h2><button class="close" data-close data-i18n-aria="close">×</button></div>
      <p data-i18n="a1"></p>
      <p data-i18n="a2"></p>
      <p data-i18n="a3"></p>
      <p data-i18n="a4"></p>
      <p class="note" data-i18n="aN"></p>
      <p class="note" data-i18n="aP"></p>
    </div>
  </div>

  <div class="modal hidden" id="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-title">
    <div class="modal-box">
      <div class="modal-top"><h2 id="profile-title" data-i18n="pT"></h2><button class="close" data-close data-i18n-aria="close">×</button></div>
      <label for="nickname" data-i18n="pL"></label>
      <input id="nickname" type="text" maxlength="20" autocomplete="nickname" data-i18n-ph="pPh">
      <div id="profile-msg" role="status"></div>
      <button class="modal-btn" id="save-profile" type="button" data-i18n="pSave"></button>
      <button class="modal-btn" id="clear-profile" type="button" style="margin-left:8px" data-i18n="pClr"></button>
      <p class="note" data-i18n="pN"></p>
    </div>
  </div>

  <div class="modal hidden" id="feedback-modal" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
    <div class="modal-box">
      <div class="modal-top">
        <h2 id="feedback-title" data-i18n="fT"></h2>
        <button class="close" data-close data-i18n-aria="close">×</button>
      </div>
      <p data-i18n="f1"></p>
      <p data-i18n="f2"></p>
      <div class="feedback-actions">
        <button class="modal-btn" id="like-button" type="button" data-i18n-aria="like" data-i18n-title="like">👍</button>
        <button class="modal-btn" id="dislike-button" type="button" data-i18n-aria="dis" data-i18n-title="dis">👎</button>
      </div>
      <p id="feedback-msg" class="note" role="status"></p>
      <p class="note" data-i18n="fN"></p>
    </div>
  </div>

  <div class="modal hidden" id="support-modal" role="dialog" aria-modal="true" aria-labelledby="support-title">
    <div class="modal-box">
      <div class="modal-top"><h2 id="support-title" data-i18n="sT"></h2><button class="close" data-close data-i18n-aria="close">×</button></div>
      <p><span data-i18n="s1"></span><br><span data-i18n="s2"></span><br><span data-i18n="s3"></span></p>

      <p class="note" data-i18n="sN"></p>
    </div>
  </div>

    function bell(x,y,r,fn){
      const c0=Math.max(0,Math.floor((x-r)/CELL)),c1=Math.min(cols-1,Math.floor((x+r)/CELL));
      const r0=Math.max(0,Math.floor((y-r)/CELL)),r1=Math.min(rows-1,Math.floor((y+r)/CELL)),rr=r*r;
      for(let row=r0;row<=r1;row++)for(let col=c0;col<=c1;col++){

      for(let r=0;r<rows;r++){
        const rr=r*cols,rU=(r>0?r-1:r)*cols,rD=(r<rows-1?r+1:r)*cols;
        for(let c=0;c<cols;c++){
          const i=rr+c,cL=c>0?c-1:c,cR=c<cols-1?c+1:c,h=height[i],o=i*4;
          const lit=(height[rr+cR]-height[rr+cL]+height[rD+c]-height[rU+c])*K;
          const net=(lit>0?lit:0)+(h>0?h*.08:0)-((lit<0?-lit:0)+(h<0?-h*.2:0));
          if(net>=0){d[o]=255;d[o+1]=240;d[o+2]=196;d[o+3]=net<.012?0:Math.min(.6,net)*255}
          else{d[o]=74;d[o+1]=43;d[o+2]=12;d[o+3]=-net<.012?0:Math.min(.62,-net)*255}
        }
      }
      hx.putImageData(img,0,0);
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      ctx.drawImage(hm,0,0,cols*CELL,rows*CELL);
      for(const p of particles){
        const a=Math.min(1,p.life/p.max*1.4);
        ctx.globalAlpha=a*.35;ctx.fillStyle='#5a3a12';ctx.fillRect(p.x+1,p.y+1.5,1.8,1.8);
        ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,1.8,1.8);
      }
      ctx.globalAlpha=1;for(const s of stones)drawStone(s,now);
    }
    const PALETTES=[
      ['#b9bfb8','#575f58'],['#8a8d8f','#2f3335'],['#55555a','#161618'],['#d3c5b2','#7d6a55'],
      ['#a98468','#4e3425'],['#d0cbbd','#8a8477'],['#93a89f','#3c4e47'],['#a3b3c1','#41505d'],
      ['#c99f70','#6b4a2a'],['#b5846f','#5a3328']
    ];
    function stonePath(s){
      ctx.beginPath();
      for(let k=0;k<=40;k++){
        const a=k/40*Math.PI*2;
        let R=1;for(const l of s.lobes)R+=l.a*Math.cos(l.k*a+l.p);
        const px=Math.cos(a)*s.rx*R,py=Math.sin(a)*s.ry*R;
        if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.closePath();
    }
    function drawStone(s,now){
      const age=Math.min(1,(now-s.born)/280),sc=1+.14*(1-age)*(1-age);
      const r=(s.rx+s.ry)/2,ca=Math.cos(s.angle),sa=Math.sin(s.angle);
      const wx=-.4*r,wy=-.45*r,lx=wx*ca+wy*sa,ly=-wx*sa+wy*ca;
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);ctx.scale(sc,sc);
      stonePath(s);ctx.shadowColor='rgba(45,28,10,.5)';ctx.shadowBlur=12;ctx.shadowOffsetX=3;ctx.shadowOffsetY=5;
      const g=ctx.createRadialGradient(lx,ly,2,0,0,s.rx*1.2);
      g.addColorStop(0,s.light);g.addColorStop(1,s.dark);ctx.fillStyle=g;ctx.fill();
      ctx.shadowColor='transparent';ctx.save();ctx.clip();
      for(const k of s.specks){
        ctx.fillStyle=k.light?'rgba(255,255,255,.2)':'rgba(0,0,0,.2)';
        ctx.beginPath();ctx.arc(k.x*s.rx,k.y*s.ry,k.r,0,Math.PI*2);ctx.fill();
      }
      const hl=ctx.createRadialGradient(lx*1.1,ly*1.1,1,lx*1.1,ly*1.1,r*.8);
      hl.addColorStop(0,'rgba(255,255,255,.28)');hl.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hl;ctx.fillRect(-s.rx*1.5,-s.ry*1.5,s.rx*3,s.ry*3);
      ctx.restore();stonePath(s);ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
    }
    function placeStone(x,y){
      const [light,dark]=PALETTES[(Math.random()*PALETTES.length)|0],rx=rand(15,28);
      const s={x,y,rx,ry:rx*rand(.62,.88),angle:rand(0,Math.PI),light,dark,lastSound:0,born:performance.now(),
        lobes:[{k:2,a:rand(.03,.09),p:rand(0,6.28)},{k:3,a:rand(.02,.07),p:rand(0,6.28)},{k:5,a:rand(.01,.03),p:rand(0,6.28)}],
        specks:Array.from({length:18},()=>({x:rand(-.8,.8),y:rand(-.8,.8),r:rand(.6,1.5),light:Math.random()<.5}))};
      s.x=clamp(s.x,s.rx+2,Math.max(s.rx+2,W-s.rx-2));
      s.y=clamp(s.y,s.ry+2,Math.max(s.ry+2,H-s.ry-2));
      stones.push(s);stoneSound();requestDraw();
    }
    function rakeStep(x,y){
      const nx=-dir.y,ny=dir.x,offs=[-9,0,9];
      for(const o of offs)carve(x+nx*o,y+ny*o,3.6,.7);
      for(const o of [-13.5,-4.5,4.5,13.5])pile(x+nx*o,y+ny*o,3.2,.14,.34);
      if(Math.random()<.1)spawnGrains(x+nx*offs[(Math.random()*3)|0],y+ny*offs[(Math.random()*3)|0],1,20);
    }
    function fingerStep(x,y){
      const nx=-dir.y,ny=dir.x;
      carve(x,y,9,.55);pile(x+dir.x*10,y+dir.y*10,7,.1,.6);
      pile(x+nx*9.5,y+ny*9.5,5,.12,.45);pile(x-nx*9.5,y-ny*9.5,5,.12,.45);
      if(Math.random()<.4)spawnGrains(x+dir.x*9,y+dir.y*9,1,38);
    }
    function smoothAt(x,y,k){
      const rx=50,ry=30,c0=Math.max(0,Math.floor((x-rx)/CELL)),c1=Math.min(cols-1,Math.floor((x+rx)/CELL));
      const r0=Math.max(0,Math.floor((y-ry)/CELL)),r1=Math.min(rows-1,Math.floor((y+ry)/CELL));
      for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
        const nx=((c+.5)*CELL-x)/rx,ny=((r+.5)*CELL-y)/ry,d2=nx*nx+ny*ny;
        if(d2>=1)continue;
        const i=r*cols+c,h=height[i];if(h===0)continue;
        const w=(1-d2)*k;
        const avg=(height[r*cols+Math.max(0,c-1)]+height[r*cols+Math.min(cols-1,c+1)]+height[Math.max(0,r-1)*cols+c]+height[Math.min(rows-1,r+1)*cols+c])*.25;
        let v=h+(avg-h)*w*1.2-h*w*.5;if(v>-.012&&v<.012)v=0;height[i]=v;
      }
      if(c1>=c0&&r1>=r0)mark(c0,r0,c1,r1);
    }
    function pushStones(x,y,mx,my){
      for(const s of stones){
        if(Math.hypot((s.x-x)/50,(s.y-y)/30)<1){
          const ox=s.x,oy=s.y;
          s.x=clamp(s.x+mx*.5,s.rx+2,Math.max(s.rx+2,W-s.rx-2));
          s.y=clamp(s.y+my*.5,s.ry+2,Math.max(s.ry+2,H-s.ry-2));
          if(Math.hypot(s.x-ox,s.y-oy)>.3){
            if(performance.now()-s.lastSound>240){stoneSlide();s.lastSound=performance.now()}
            needDraw=true;
          }
        }
      }
    }
    function smoothAll(){
      if(!height)return;settle=110;requestDraw();smoothAllSound();hint(t('hAll'));
    }

    const RIPPLE_GAP=7,RIPPLE_START=14,RIPPLE_MAX=80,RIPPLE_GROW=12;
    const RIPPLE_FREQ=[196,197.4,294,392,588];
    const RIPPLE_AMP=[1,.7,.5,.3,.12];
    let rp=null;
    function ringStamp(x,y,i){
      const r=i*RIPPLE_GAP,fade=Math.max(0,1-r/(RIPPLE_MAX+RIPPLE_GAP));
      const amp=.28*fade*fade+.04;
      for(let a=0;a<Math.PI*2;a+=2/r){
        const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
        if(i%2)pile(px,py,2.8,amp,.3);else carve(px,py,2.8,amp);
      }
    }
    function startRippleVoice(){
      if(!ac||!enabled.fx)return null;
      const t0=ac.currentTime,g=ac.createGain();
      g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(.13,t0+1.2);g.connect(fxMaster);
      const lfo=ac.createOscillator(),lg=ac.createGain();
      lfo.frequency.value=.35;lg.gain.value=.02;lfo.connect(lg);lg.connect(g.gain);lfo.start(t0);
      const oscs=RIPPLE_FREQ.map((f,i)=>{
        const o=ac.createOscillator(),og=ac.createGain();
        o.type='sine';o.frequency.value=f;og.gain.value=RIPPLE_AMP[i];
        o.connect(og);og.connect(g);o.start(t0);return o;
      });
      return{g,oscs,lfo,lg};
    }
    function growRipple(now){
      if(!rp||rp.done)return;
      const radius=Math.min(RIPPLE_MAX,RIPPLE_START+(now-rp.t0)/1000*RIPPLE_GROW);
      const target=Math.floor(radius/RIPPLE_GAP);
      while(rp.ring<target){rp.ring++;ringStamp(rp.x,rp.y,rp.ring)}
      if(rp.voice&&ac)rp.voice.oscs.forEach((o,i)=>o.frequency.setTargetAtTime(RIPPLE_FREQ[i]*(1+radius/500),ac.currentTime,.6));
      if(radius>=RIPPLE_MAX)rp.done=true;
    }
    function startRipple(e,p){
      const now=performance.now();
      rp={id:e.pointerId,x:p.x,y:p.y,t0:now,ring:0,done:false,samples:[{x:e.clientX,y:e.clientY,t:now}],voice:startRippleVoice()};
      carve(p.x,p.y,5,.45);try{canvas.setPointerCapture(e.pointerId)}catch{}
      growRipple(now);requestDraw();
    }
    function endRipple(e){
      if(!rp||(e&&e.pointerId!==rp.id))return;
      const now=performance.now(),recent=rp.samples.filter(s=>now-s.t<150);
      let speed=0;
      if(recent.length>1){
        const a=recent[0],b=recent[recent.length-1];
        speed=Math.hypot(b.x-a.x,b.y-a.y)/Math.max(1,b.t-a.t);
      }
      const fade=clamp(10/(1+speed*2),3,10);
      if(rp.voice&&ac){
        const t0=ac.currentTime,v=rp.voice;
        v.g.gain.cancelScheduledValues(t0);
        v.g.gain.setValueAtTime(Math.max(v.g.gain.value,.0001),t0);
        v.g.gain.setTargetAtTime(.0001,t0,fade/4);
        v.lg.gain.setTargetAtTime(0,t0,fade/6);
        v.oscs.forEach(o=>o.stop(t0+fade+1));
        v.lfo.stop(t0+fade+1);
      }
      rp=null;
    }

    function kick(){if(!looping){looping=true;requestAnimationFrame(tick)}}
    function requestDraw(){needDraw=true;kick()}
    function tick(now){
      looping=false;
      const dt=Math.min(.05,prevT?(now-prevT)/1000:.016);prevT=now;
      if(rp)growRipple(now);
      if(drawing){
        if(tool==='smooth'&&cur&&now-lastMoveT>60)smoothAt(cur.x,cur.y,.015);
        if(now-lastMoveT>110)stopSandSound();
      }
      if(settle>0){
        for(let i=0;i<height.length;i++){const v=height[i]*.955;height[i]=(v>-.01&&v<.01)?0:v}
        settle--;needDraw=true;if(settle===0)height.fill(0);
      }
      relaxDirty();
      if(particles.length){updateParticles(dt);needDraw=true}
      const young=stones.some(s=>now-s.born<300);
      if(young)needDraw=true;
      if(needDraw){render(now);needDraw=false}
      if((rp&&!rp.done)||drawing||settle>0||particles.length||young)kick();else prevT=0;
    }
    function hint(text){
      $('hint').textContent=text;$('hint').classList.add('show');
      clearTimeout(hintTimer);hintTimer=setTimeout(()=>$('hint').classList.remove('show'),2600);
    }
    function pos(e){
      const rect=canvas.getBoundingClientRect();
      return{x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height};
    }
    function stroke(a,b,now){
      const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);
      const ux=dx/dist,uy=dy/dist;
      if(!hasDir){dir={x:ux,y:uy};hasDir=true}
      const n=Math.max(1,Math.ceil(dist/3)),sx=dx/n,sy=dy/n;
      for(let i=1;i<=n;i++){
        const x=a.x+sx*i,y=a.y+sy*i;
        dir.x=dir.x*.82+ux*.18;dir.y=dir.y*.82+uy*.18;
        const m=Math.hypot(dir.x,dir.y)||1;dir.x/=m;dir.y/=m;
        if(tool==='rake')rakeStep(x,y);
        else if(tool==='finger')fingerStep(x,y);
        else if(tool==='smooth'){smoothAt(x,y,.02);pushStones(x,y,sx,sy)}
      }
      lastMoveT=now;startSandSound(vs,tool);requestDraw();
    }
    canvas.addEventListener('pointerdown',e=>{
      if(settingsOpen){closeSettings();return}
      if(document.querySelector('.modal:not(.hidden)'))return;
      initAudio();const p=pos(e);
      if(tool==='ripple'){if(rp)endRipple();startRipple(e,p);e.preventDefault();return}
      if(tool==='stone'){placeStone(p.x,p.y);e.preventDefault();return}
      drawing=true;pid=e.pointerId;lastP=p;cur=p;hasDir=false;vs=0;
      lastMoveT=lastEvT=performance.now();
      try{canvas.setPointerCapture(e.pointerId)}catch{}
      kick();e.preventDefault();
    });
    canvas.addEventListener('pointermove',e=>{
      if(rp&&e.pointerId===rp.id){
        const now=performance.now();
        rp.samples.push({x:e.clientX,y:e.clientY,t:now});
        while(rp.samples.length&&now-rp.samples[0].t>300)rp.samples.shift();
        return;
      }
      if(!drawing||pid!==e.pointerId)return;
      const p=pos(e),dist=Math.hypot(p.x-lastP.x,p.y-lastP.y);
      if(dist<1)return;
      const now=performance.now();
      vs=vs*.6+(dist/Math.max(1,now-lastEvT))*.4;
      stroke(lastP,p,now);lastP=p;cur=p;lastEvT=now;e.preventDefault();
    });
    function endStroke(e){
      if(rp&&(!e||e.pointerId===rp.id)){endRipple(e);return}
      if(e&&pid!==null&&e.pointerId!==pid)return;
      drawing=false;pid=null;stopSandSound();
    }
    canvas.addEventListener('pointerup',endStroke);
    canvas.addEventListener('pointercancel',endStroke);
    canvas.addEventListener('lostpointercapture',endStroke);
    const HINT_KEYS={rake:'hRake',finger:'hFing',ripple:'hRip',stone:'hSto',smooth:'hSm'};
    document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
      if(rp)endRipple();drawing=false;pid=null;tool=b.dataset.tool;
      document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));
      stopSandSound();hint(t(HINT_KEYS[tool]));
    });
    $('smooth-all').onclick=smoothAll;
    $('reset').onclick=()=>{
      if(!height)return;if(rp)endRipple();
      height.fill(0);stones=[];particles.length=0;settle=0;
      stopSandSound();requestDraw();beep(170,.25,.07);hint(t('hReset'));
    };
    $('start').onclick=()=>{
      closeSettings();$('intro').style.display='none';$('game').style.display='flex';
      resize();initAudio();updateMusicTip();hint(t('hStart'));
    };
    $('home-button').onclick=()=>{
      closeSettings();
      if(rp)endRipple();
      drawing=false;pid=null;stopSandSound();
      $('game').style.display='none';
      $('intro').style.display='flex';
      updateMusicTip();
    };

    applyLang();
  </script>
